    tagline: Клиентский сервис, нейминг, продакшен
    bio_html: Помогаю запускать проекты и усиливать действующие в качестве креативного и продуктового директора. Более 190 работ для MTV, СТС, «За рулём», Московского марафона, медицинских центров, магазинов и арт-пространств. Берусь за задачи под ключ — формирую стратегию, нейминг, дизайн-макеты и яркие бизнес-концепции с конкурентным отличием. Формирую команду под задачу, привлекаю внимание прессы, предлагаю чёткие решения. Работаю быстро, самостоятельно и с фокусом на результат. Задать вопрос о своём проекте можно %{link}.
